
  version: '3.8'
  services:
    postgres:
      image: postgres:16-alpine
      environment:
        POSTGRES_DB: authdb
        POSTGRES_USER: auth_user
        POSTGRES_PASSWORD: auth_pass
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U auth_user -d authdb"]
        interval: 10s
        timeout: 5s
        retries: 5

  volumes:
    postgres_data: