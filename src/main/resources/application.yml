spring:
  application:
    name: auth-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      client:
        registration:
          google:
            client-id: ${OAUTH_GITHUB_CLIENT_ID:https://accounts.google.com/o/oauth2/v2/auth?client_id=108781646598643-qr9b9d8v5hugmivcvuecjvh234q1a48m.apps.googleusercontent.com}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET: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}
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/google"
            scope:
              - email
              - profile

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:veryLongAndSecureJwtSecretKeyThatShouldBeStoredSecurely}
    access-token:
      expiration: 3600000  # 1 hour in milliseconds
    refresh-token:
      expiration: 86400000  # 24 hours in milliseconds

# Logging configuration
logging:
  level:
    root: INFO
    com.authservice: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
