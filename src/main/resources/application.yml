spring:
  application:
    name: auth-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      client:
        registration:
          google:
            client-id:
            client-secret:
            redirect-uri: http://localhost:4200/auth/callback
            scope:
              - openid
              - email
              - profile

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:veryLongAndSecureJwtSecretKeyThatShouldBeStoredSecurely}
    access-token:
      expiration: 3600000  # 1 hour in milliseconds
    refresh-token:
      expiration: 86400000  # 24 hours in milliseconds
  oauth2:
    pkce:
      enabled: true  # Enable PKCE for enhanced security
    # Add localhost:8080 as an authorized redirect URI
    authorizedRedirectUris:
      - http://localhost:4200/auth/callback  # Frontend app callback URL

# Logging configuration
logging:
  level:
    root: INFO
    com.authservice: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
  file:
    name: logs/auth-service.log
    max-size: 10MB
    max-history: 30

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized